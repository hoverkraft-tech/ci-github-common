# For this action to work you must explicitly allow GitHub Actions to create pull requests.
# See https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository.
name: "Create and merge Pull Request"
description: |
  Action to create and merge Pull Request.
  Set GitHub Actions bot as author, then merge the created commit with the configured strategy.
  Run generation and validation before calling this action. It attempts the merge immediately;
  it does not wait for the pull request's CI or enable GitHub's optional auto-merge feature.
  Administrator bypass is enabled by default. Set bypass-branch-protection to false to request a normal merge.
  A pull request head change after creation prevents the merge.
author: hoverkraft
branding:
  icon: git-pull-request
  color: blue

inputs:
  github-token:
    description: |
      GitHub token for creating and merging pull request (permissions contents: write and pull-requests: write).
      See https://github.com/peter-evans/create-pull-request#action-inputs.
    default: ${{ github.token }}
    required: false
  branch:
    description: "The pull request branch name"
    required: true
  title:
    description: "The pull request title and, for merge/squash merges, the merged commit title"
    required: true
  body:
    description: "The pull request body"
    required: true
  commit-message:
    description: "The commit message for the pull request and, for merge/squash merges, the merged commit body"
    required: true
  add-paths:
    description: |
      Newline-separated paths to include in the commit, forwarded to peter-evans/create-pull-request.
      Empty includes all changes. Use this to restrict generated updates to their intended files.
    required: false
  bypass-branch-protection:
    description: |
      Request administrator merge privileges with --admin. Requires a token allowed to bypass the repository's rules.
      This can bypass required reviews, status checks and merge queues. The expected PR head is still checked.
    default: "true"
    required: false
  merge-method:
    description: |
      Merge strategy for the created pull request.
      Valid values: `merge`, `rebase`, `squash`.
    default: rebase
    required: false

outputs:
  merged-ref:
    description: "The fully qualified ref updated by the merge."
    value: ${{ steps.merge-pull-request.outputs.merged-ref }}
  merged-sha:
    description: "The commit SHA at the merged ref after the merge completes."
    value: ${{ steps.merge-pull-request.outputs.merged-sha }}

runs:
  using: "composite"
  steps:
    - id: github-actions-bot-user
      uses: $/actions/get-github-actions-bot-user

    - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      id: create-pull-request
      with:
        token: ${{ inputs.github-token }}
        signoff: true
        sign-commits: true
        base: ${{ github.event.repository.default_branch }}
        delete-branch: true
        branch: ${{ inputs.branch }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
        commit-message: ${{ inputs.commit-message }}
        add-paths: ${{ inputs.add-paths }}
        author: ${{ steps.github-actions-bot-user.outputs.name }} <${{ steps.github-actions-bot-user.outputs.email }}>
        committer: ${{ steps.github-actions-bot-user.outputs.name }} <${{ steps.github-actions-bot-user.outputs.email }}>

    - id: merge-pull-request
      name: Merge pull request
      if: steps.create-pull-request.outputs.pull-request-number && steps.create-pull-request.outputs.pull-request-operation != 'closed'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        PULL_REQUEST_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        PULL_REQUEST_HEAD_SHA: ${{ steps.create-pull-request.outputs.pull-request-head-sha }}
        BYPASS_BRANCH_PROTECTION: ${{ inputs.bypass-branch-protection }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        PULL_REQUEST_TITLE: ${{ inputs.title }}
        PULL_REQUEST_COMMIT_MESSAGE: ${{ inputs.commit-message }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { pathToFileURL } = require('node:url');
          const { join } = require('node:path');
          const moduleUrl = pathToFileURL(join(process.env.ACTION_PATH, 'src', 'index.js'));
          const { run } = await import(moduleUrl.href);
          await run({ core, context, github, exec });
