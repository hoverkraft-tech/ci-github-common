# One reporting boundary for the whole originating workflow run.
# Put every participating producer (including reusable matrix jobs) in needs and
# use if: always(). Forward only job-results: toJSON(needs); no report inventory.
#
# Defaults: lint and test results use annotations. Coverage uses GitHub Code
# Quality when positively available, with a PR comment fallback otherwise.
# Select newline-separated reporters, or an empty string to disable publication.
# Evidence validation and the final CI reports complete check remain required.
# See docs/usage/ci-reports.md for permissions, examples and the report contract.
name: CI reports
on:
  workflow_call:
    inputs:
      job-results:
        description: JSON needs context for every completed producer in the originating workflow.
        type: string
        required: true
      lint-reporters:
        description: Newline-separated annotations, comment, code-scanning. Empty disables publication.
        type: string
        default: annotations
      test-results-reporters:
        description: Newline-separated annotations, comment. Empty disables publication.
        type: string
        default: annotations
      test-coverage-reporters:
        description: Newline-separated `auto`, `github`, `codecov`, `coveralls`, `comment`. Auto uses GitHub when available, then comment or summary. Explicit `github` is required.
        type: string
        default: auto
    secrets:
      codecov-token:
        description: Optional Codecov token. Without it, Codecov uses GitHub OIDC.
    outputs:
      markdown:
        description: Final summary after all publication attempts, including comment delivery.
        value: ${{ jobs.complete.outputs.markdown }}
      artifact-id:
        description: Validated report collection artifact ID.
        value: ${{ jobs.collect.outputs.artifact-id }}
permissions: {}
jobs:
  collect:
    name: Collect CI reports
    if: ${{ !cancelled() && !contains(fromJSON(inputs.job-results).*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      artifact-id: ${{ steps.collect.outputs.artifact-id }}
      datasets: ${{ steps.collect.outputs.datasets }}
      reporters: ${{ steps.collect.outputs.reporters }}
      annotations: ${{ steps.collect.outputs.annotations }}
      code-scanning: ${{ steps.collect.outputs.code-scanning }}
    steps:
      - id: collect
        uses: $/.github/actions/ci-reports
        with:
          operation: collect
          job-results: ${{ inputs.job-results }}
          reporters: ${{ format('{{"lint":{0},"test":{1},"coverage":{2}}}', toJSON(inputs.lint-reporters), toJSON(inputs.test-results-reporters), toJSON(inputs.test-coverage-reporters)) }}

  annotations:
    name: Publish annotations
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.annotations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: $/.github/actions/ci-reports
        with:
          operation: annotations
          artifact-id: ${{ needs.collect.outputs.artifact-id }}

  code-scanning:
    name: Publish lint to code scanning
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.code-scanning == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      security-events: write
    steps:
      - uses: $/.github/actions/ci-reports
        with:
          operation: code-scanning
          artifact-id: ${{ needs.collect.outputs.artifact-id }}

  github-coverage:
    name: Publish GitHub coverage (${{ matrix.dataset.label }})
    needs: collect
    if: >-
      ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.datasets != '[]' &&
          (contains(fromJSON(needs.collect.outputs.reporters).coverage, 'auto') || contains(fromJSON(needs.collect.outputs.reporters).coverage, 'github')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
      code-quality: write
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.collect.outputs.datasets || '[]') }}
    steps:
      - uses: $/.github/actions/ci-reports
        with:
          operation: github
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          dataset: ${{ matrix.dataset.id }}

  codecov:
    name: Submit Codecov coverage (${{ matrix.dataset.label }})
    needs: collect
    if: >-
      ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.datasets != '[]' &&
          contains(fromJSON(needs.collect.outputs.reporters).coverage, 'codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.collect.outputs.datasets || '[]') }}
    steps:
      - id: prepare
        uses: $/.github/actions/ci-reports
        with:
          operation: prepare-external
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          dataset: ${{ matrix.dataset.id }}
          reporter: codecov
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.sha }}
          persist-credentials: false
      - id: upload
        env:
          CODECOV_TOKEN: ${{ secrets.codecov-token }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.2
          files: ${{ steps.prepare.outputs.file }}
          flags: ${{ matrix.dataset.id }}
          override_commit: ${{ steps.prepare.outputs.sha }}
          disable_search: true
          disable_file_fixes: true
          disable_safe_directory: true
          handle_no_reports_found: false
          fail_ci_if_error: true
          plugins: noop
          cleanup: true
          use_oidc: ${{ env.CODECOV_TOKEN == '' }}
          token: ${{ env.CODECOV_TOKEN }}
      - name: Retain submission outcome
        if: ${{ !cancelled() }}
        uses: $/.github/actions/ci-reports
        with:
          operation: external-receipt
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          dataset: ${{ matrix.dataset.id }}
          reporter: codecov
          outcome: ${{ steps.upload.outcome }}
          cleanup-directory: ${{ steps.prepare.outputs.directory }}

  coveralls:
    name: Submit Coveralls coverage (${{ matrix.dataset.label }})
    needs: collect
    if: >-
      ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.datasets != '[]' &&
          contains(fromJSON(needs.collect.outputs.reporters).coverage, 'coveralls') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.collect.outputs.datasets || '[]') }}
    steps:
      - id: prepare
        uses: $/.github/actions/ci-reports
        with:
          operation: prepare-external
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          dataset: ${{ matrix.dataset.id }}
          reporter: coveralls
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.sha }}
          persist-credentials: false
      - id: upload
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          coverage-reporter-version: v0.6.22
          file: ${{ steps.prepare.outputs.file }}
          format: ${{ steps.prepare.outputs.format }}
          flag-name: ${{ matrix.dataset.id }}
          git-commit: ${{ steps.prepare.outputs.sha }}
          build-number: ${{ github.run_id }}-${{ github.run_attempt }}
          parallel: true
          allow-empty: false
          fail-on-error: true
      - name: Retain submission outcome
        if: ${{ !cancelled() }}
        uses: $/.github/actions/ci-reports
        with:
          operation: external-receipt
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          dataset: ${{ matrix.dataset.id }}
          reporter: coveralls
          outcome: ${{ steps.upload.outcome }}
          cleanup-directory: ${{ steps.prepare.outputs.directory }}

  coveralls-finish:
    name: Complete Coveralls build
    needs: [collect, coveralls]
    if: >-
      ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.datasets != '[]' &&
          contains(fromJSON(needs.collect.outputs.reporters).coverage, 'coveralls') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - id: verify
        uses: $/.github/actions/ci-reports
        with:
          operation: check-coveralls
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
      - id: finish
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          coverage-reporter-version: v0.6.22
          parallel-finished: true
          build-number: ${{ github.run_id }}-${{ github.run_attempt }}
          git-commit: ${{ steps.verify.outputs.sha }}
          fail-on-error: true
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/ci-reports
        with:
          operation: finish-coveralls
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          outcome: ${{ steps.finish.outcome }}

  comment:
    name: Update CI comment
    needs:
      [
        collect,
        annotations,
        code-scanning,
        github-coverage,
        codecov,
        coveralls,
        coveralls-finish,
      ]
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: ci-reports-comment-${{ github.repository }}-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: $/.github/actions/ci-reports
        with:
          operation: comment
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          publisher-jobs: ${{ toJSON(needs) }}

  complete:
    name: CI reports complete
    needs:
      [
        collect,
        annotations,
        code-scanning,
        github-coverage,
        codecov,
        coveralls,
        coveralls-finish,
        comment,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      markdown: ${{ steps.complete.outputs.markdown }}
    steps:
      - id: complete
        uses: $/.github/actions/ci-reports
        with:
          operation: complete
          artifact-id: ${{ needs.collect.outputs.artifact-id }}
          publisher-jobs: ${{ toJSON(needs) }}
