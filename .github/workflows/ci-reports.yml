# Collect native reports after lint and test jobs and update one PR comment per report type.
#
# Call once with `needs` listing the lint and test jobs, `if: always()` and
# `job-results: ${{ toJSON(needs) }}`. Keep producer jobs as required checks.
# Producers must disable individual comments and upload only report files in
# artifacts named `ci-reports-<run_attempt>-<job ID>-<unique name>`. Use the same
# job IDs in the caller and its reusable workflows, or set the producer's report
# group to its outer calling job ID. Only artifacts belonging to these jobs are
# downloaded. Directories are kept
# separate so identically named reports cannot overwrite one another.
# The shared linter uploads its native `super-linter-summary.md`; call it from
# a job named `lint` with `comment: false`. Other lint producers can upload any
# lint format supported by parse-ci-reports (ESLint, SARIF, Checkstyle, etc.).
# Comments show concise totals with report and job details collapsed by default.
#
# Only this run's current attempt is read. When rerunning failed jobs, reports
# from jobs that did not rerun are explicitly unavailable; rerun all jobs for a
# complete report. Missing reports never imply successful tests. Coverage stays
# separate per source report; percentages are never averaged.
# GitHub's abandoned reusable-job results remain visible with a warning;
# they do not establish success, even when individual reports contain no failures.
#
# Grant contents: read and pull-requests: write. Fork PRs retain
# summaries without commenting. Use the caller's concurrency to cancel superseded
# runs. This workflow serializes publication and rejects an outdated PR head.
# Independent previews with comment: false should each set a unique
# concurrency-group to prevent pending preview jobs from cancelling each other.
#
# ## Native GitHub coverage
#
# Configure producers with stable labels and report-group matching the outer job.
# Test the PR head SHA when collecting native coverage. Supply every expected
# component, including those in a job matrix; discovery alone cannot detect a
# missing component. Source paths must match repository files. Do not upload
# separate reports for shards or suites that cover overlapping files.
#
# ```yaml
# reports:
#   needs: [backend, frontend]
#   if: always()
#   uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@<commit-sha>
#   permissions:
#     contents: read
#     pull-requests: write
#   with:
#     job-results: ${{ toJSON(needs) }}
#     coverage-reports: '[{"job":"backend","label":"backend"},{"job":"frontend","label":"frontend"}]'
# coverage:
#   needs: reports
#   if: needs.reports.outputs.coverage-artifact-id != ''
#   uses: hoverkraft-tech/ci-github-common/.github/workflows/publish-coverage.yml@<commit-sha>
#   permissions:
#     code-quality: write
#     pull-requests: read
#   with:
#     artifact-id: ${{ needs.reports.outputs.coverage-artifact-id }}
#     reports: ${{ needs.reports.outputs.coverage-reports }}
# ```
#
# Keep producer checks, this collector and Coverage publication complete required.
# Publication requires Code Quality enabled on an eligible repository; collection
# and diagnostics work without it. Re-run all producers after a partial rerun.
name: CI reports

on:
  workflow_call:
    inputs:
      comment:
        description: Publish combined PR comments. Disable for report previews or workflow tests; summaries and outputs remain available.
        type: boolean
        default: true
      concurrency-group:
        description: Concurrency group for independent previews with comment false. Empty retains the default PR group. Commenting runs always share the default group.
        type: string
        default: ""
      coverage-reports:
        description: |
          Opt-in native coverage inventory as a JSON array of job and label.
          Example: [{"job":"backend","label":"backend"},{"job":"frontend","label":"frontend"}].
          Producers use coverage-reports prepare with matching report-group and labels.
          Every component must be present exactly once in this run and attempt, from successful jobs.
          Overlapping source files must be merged by the test framework before collection.
          Disables our coverage PR comment; summaries and test/lint comments remain.
          Pass the coverage outputs to publish-coverage with code-quality write permission.
        type: string
        default: "[]"
      job-results:
        description: JSON needs context containing lint and test jobs and their results.
        type: string
        required: true
    outputs:
      coverage-artifact-id:
        description: Validated native coverage artifact for publish-coverage, empty when disabled or invalid.
        value: ${{ jobs.reports.outputs.coverage-artifact-id }}
      coverage-reports:
        description: Validated JSON report collection for publish-coverage.
        value: ${{ jobs.reports.outputs.coverage-reports }}
      lint-markdown:
        description: Consolidated lint report, including native Super-Linter summaries and parsed diagnostics.
        value: ${{ jobs.reports.outputs.lint-markdown }}
      test-markdown:
        description: Consolidated test report, including job status and missing-report information.
        value: ${{ jobs.reports.outputs.test-markdown }}
      coverage-markdown:
        description: Consolidated coverage report with separate source sections.
        value: ${{ jobs.reports.outputs.coverage-markdown }}

permissions: {}

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ !inputs.comment && inputs.concurrency-group || format('ci-reports-{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
      cancel-in-progress: false
    outputs:
      coverage-artifact-id: ${{ steps.collect-coverage.outputs.artifact-id }}
      coverage-reports: ${{ steps.collect-coverage.outputs.reports }}
      lint-markdown: ${{ steps.compose.outputs.lint }}
      test-markdown: ${{ steps.compose.outputs.tests }}
      coverage-markdown: ${{ steps.compose.outputs.coverage }}
    steps:
      - name: Prepare report directory
        id: directory
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_RESULTS: ${{ inputs.job-results }}
          COVERAGE_REPORTS: ${{ inputs.coverage-reports }}
        with:
          script: |
            const jobs = Object.entries(JSON.parse(process.env.JOB_RESULTS));
            if (!jobs.length || jobs.some(([name, job]) => !/^[\w-]+$/.test(name) || !['success', 'failure', 'cancelled', 'skipped', 'abandoned'].includes(job?.result))) {
              throw new Error('job-results must contain job IDs and their completed results');
            }
            const names = jobs.map(([name]) => name);
            const group = names.length === 1 ? names[0] : `{${names.join(',')}}`;
            core.setOutput('pattern', `ci-reports-${process.env.GITHUB_RUN_ATTEMPT}-${group}-*`);
            const { mkdtemp } = require('node:fs/promises');
            const path = require('node:path');
            core.setOutput('path', await mkdtemp(path.join(process.env.RUNNER_TEMP, 'ci-reports-')));
            const expected = JSON.parse(process.env.COVERAGE_REPORTS);
            if (!Array.isArray(expected)) throw new Error('coverage-reports must be a JSON array.');
            if (expected.length) {
              if (expected.some(report => !report || !names.includes(report.job))) throw new Error('Every coverage component must name a job in job-results.');
              const coverageJobs = [...new Set(expected.map(report => report.job))];
              const coverageGroup = coverageJobs.length === 1 ? coverageJobs[0] : `{${coverageJobs.join(',')}}`;
              core.setOutput('coverage-pattern', `ci-coverage-${process.env.GITHUB_RUN_ATTEMPT}-${coverageGroup}-*`);
              core.setOutput('coverage-path', await mkdtemp(path.join(process.env.RUNNER_TEMP, 'ci-native-coverage-')));
            }
      - name: Download reports from this attempt
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ steps.directory.outputs.pattern }}
          path: ${{ steps.directory.outputs.path }}
      - name: Download native coverage from this attempt
        id: download-coverage
        if: steps.directory.outputs.coverage-pattern != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ steps.directory.outputs.coverage-pattern }}
          path: ${{ steps.directory.outputs.coverage-path }}
      - name: Discover native reports
        id: native-reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_DIRECTORY: ${{ steps.directory.outputs.path }}
        with:
          script: |
            const directory = process.env.REPORT_DIRECTORY;
            const reports = await glob.create(`${directory}/**/*\n!${directory}/**/super-linter-summary.md`, { matchDirectories: false });
            core.setOutput('paths', (await reports.glob()).join('\n'));
      - name: Parse reports
        id: parse
        if: steps.native-reports.outputs.paths != ''
        uses: $/actions/quality/parse-ci-reports
        with:
          working-directory: ${{ steps.directory.outputs.path }}
          report-paths: ${{ steps.native-reports.outputs.paths }}
          report-name: CI results
          output-format: markdown
      - name: Compose reports and check publication eligibility
        id: compose
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_RESULTS: ${{ inputs.job-results }}
          LINT_MARKDOWN: ${{ steps.parse.outputs.lint-markdown }}
          TEST_MARKDOWN: ${{ steps.parse.outputs.test-markdown }}
          COVERAGE_MARKDOWN: ${{ steps.parse.outputs.coverage-markdown }}
          PARSE_OUTCOME: ${{ steps.parse.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          REPORT_DIRECTORY: ${{ steps.directory.outputs.path }}
          COMMENT: ${{ inputs.comment }}
        with:
          script: |
            const jobs = Object.entries(JSON.parse(process.env.JOB_RESULTS));
            const results = ['success', 'failure', 'cancelled', 'skipped', 'abandoned'];
            if (!jobs.length || jobs.some(([name, job]) => !/^[\w-]+$/.test(name) || !results.includes(job?.result))) {
              throw new Error('job-results must contain job IDs and their completed results');
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const header = `[Workflow run and full reports](${run}) · Commit ${context.sha.slice(0, 7)}\n\n`;
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = process.env.REPORT_DIRECTORY || '';
            const artifacts = fs.existsSync(directory) ? fs.readdirSync(directory) : [];
            let missing = 0;
            const status = '| Job | Result | Report artifacts |\n| --- | --- | --- |\n' + jobs.map(([name, job]) => {
              const prefix = `ci-reports-${process.env.GITHUB_RUN_ATTEMPT}-${name}-`;
              const count = artifacts.filter(artifact => artifact.startsWith(prefix)).length;
              if (!count) missing++;
              return `| ${name} | ${job.result} | ${count || '**Unavailable**'} |`;
            }).join('\n');
            const outcomes = results.map(result => `${jobs.filter(([, job]) => job.result === result).length} ${result}`).join(' · ');
            const warning = missing ? `\n\n⚠️ Reports unavailable for ${missing} job(s). Missing reports do not mean passing checks.` : '';
            const abandoned = jobs.some(([, job]) => job.result === 'abandoned') ? '\n\n⚠️ GitHub reported an abandoned job result. Inspect its nested job checks; this does not establish success.' : '';
            const notice = 'Only this attempt is included. On partial reruns, rerun all producer jobs for complete reports. CodeQL findings remain in code scanning; other diagnostics remain in the job logs.';
            const jobDetails = `<details>\n<summary>Job results and report availability</summary>\n\n${status}\n\n${notice}\n\n</details>`;
            const available = process.env.PARSE_OUTCOME === 'success' && process.env.DOWNLOAD_OUTCOME === 'success';
            const lintReports = available && process.env.LINT_MARKDOWN ? [process.env.LINT_MARKDOWN] : [];
            if (process.env.DOWNLOAD_OUTCOME === 'success') {
              const summaries = await glob.create(path.join(directory, '**/super-linter-summary.md'), { followSymbolicLinks: false, matchDirectories: false });
              for (const file of await summaries.glob()) {
                const summary = fs.readFileSync(file, 'utf8');
                if (!summary.trim()) continue;
                const details = summary.length > 45000 ? `Summary exceeds the comment limit. [Read the artifact](${run}).` : summary;
                lintReports.push(`<details>\n<summary>Super-Linter details</summary>\n\n${details}\n\n</details>`);
              }
            }
            const lint = lintReports.length ? `**Lint:** Collected diagnostics and Super-Linter summaries. Execution status is included in the job outcomes.\n\n${lintReports.join('\n\n')}` : '';
            for (const [type, report] of [['tests', available && process.env.TEST_MARKDOWN], ['coverage', available && process.env.COVERAGE_MARKDOWN], ['lint', lint]]) {
              const prefix = `${header}**Jobs:** ${outcomes}.${warning}${abandoned}\n\n`;
              let content = report || `No ${type} reports available for this attempt. See the job results and workflow logs.`;
              if (!available) content = `⚠️ Report collection or parsing did not complete; results may be incomplete.\n\n${content}`;
              if ((prefix + content + jobDetails).length > 60000) {
                // Omit whole sections instead of cutting HTML or Markdown in the middle.
                content = `${content.split('\n')[0]}\n\nDetails exceed the comment limit. [Read the full report artifacts](${run}).`;
              }
              const body = `${prefix}${content}\n\n${jobDetails}`;
              core.setOutput(type, body);
              await core.summary.addRaw(body + '\n\n').write();
            }
            const pr = context.payload.pull_request;
            if (process.env.COMMENT !== 'true' || context.eventName !== 'pull_request' || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
            core.setOutput('comment', current.state === 'open' && current.head.sha === pr.head.sha);
      - name: Update test results comment
        if: always() && steps.compose.outputs.comment == 'true'
        uses: $/actions/create-or-update-comment
        with:
          title: "${{ github.workflow }} - Test results"
          token: ${{ github.token }}
          body: ${{ steps.compose.outputs.tests }}
      - name: Update coverage comment
        if: always() && steps.compose.outputs.comment == 'true' && steps.directory.outputs.coverage-pattern == ''
        uses: $/actions/create-or-update-comment
        with:
          title: "${{ github.workflow }} - Code coverage"
          token: ${{ github.token }}
          body: ${{ steps.compose.outputs.coverage }}
      - name: Update lint comment
        if: always() && steps.compose.outputs.comment == 'true'
        uses: $/actions/create-or-update-comment
        with:
          title: "${{ github.workflow }} - Lint results"
          token: ${{ github.token }}
          body: ${{ steps.compose.outputs.lint }}
      - name: Validate complete native coverage collection
        id: collect-coverage
        if: ${{ !cancelled() && steps.directory.outputs.coverage-pattern != '' && steps.download-coverage.outcome == 'success' }}
        uses: $/actions/quality/coverage-reports
        with:
          operation: collect
          working-directory: ${{ steps.directory.outputs.coverage-path }}
          expected-reports: ${{ inputs.coverage-reports }}
          job-results: ${{ inputs.job-results }}
