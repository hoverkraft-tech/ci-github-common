---
name: Internal - Release

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: force only bypasses the no-changes guard; source and CI settings stay fixed.
    inputs:
      force:
        description: "Release even when no relevant changes are detected."
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  release:
    name: Create and publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Use the app token so publishing the tag triggers the main CI documentation jobs.
      - id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] CI bot authentication is required to trigger tag workflows
          permission-contents: write
          permission-pull-requests: read

      - name: Plan release
        id: plan-release
        uses: hoverkraft-tech/ci-github-publish/actions/release/plan@704e6c786af0f5dfd84a8851e428bb36b6cf180f # 3.0.1
        with:
          target-ref: ${{ github.sha }}
          force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          github-token: ${{ steps.generate-token.outputs.token }}

      - name: Create and publish release
        if: steps.plan-release.outputs.should-release == 'true' && steps.plan-release.outputs.tag != ''
        uses: hoverkraft-tech/ci-github-publish/actions/release/create@704e6c786af0f5dfd84a8851e428bb36b6cf180f # 3.0.1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # zizmor: ignore[secrets-outside-env] repository secret is scoped to the release summary step
        with:
          tag: ${{ steps.plan-release.outputs.tag }}
          target-ref: ${{ github.sha }}
          publish: "true"
          changelog-summary: |
            {
              "llmAuth": ${{ toJSON(env.OPENAI_API_KEY) }},
              "llmProvider": "openai"
            }
          github-token: ${{ steps.generate-token.outputs.token }}
