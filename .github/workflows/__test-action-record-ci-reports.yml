name: Internal - Tests for record-ci-reports action
on:
  workflow_call:
    outputs:
      report-plan:
        description: Expected native report plan.
        value: ${{ jobs.continuous-integration.outputs.report-plan }}
permissions: {}
jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@11636b817040a2a7d61b389c28fa1b401c37a2fa # unified reports (PR #624, unreleased)
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: actions/quality/record-ci-reports
      build: ""
      lint: ""
      test: '{"coverage":false}'
  configuration:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      report-plan: ${{ steps.plan.outputs.report-plan }}
      selections: ${{ steps.plan.outputs.selections }}
      matrix: ${{ steps.components.outputs.matrix }}
    steps:
      - id: components
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |-
            const matrix = ['frontend','backend'];
            core.setOutput('matrix',matrix);
            core.setOutput('producers',matrix.map(component => ({key:component,job:'fixtures',type:'test',directory:'.fixture-native/'+component,coverage:[{file:'cobertura.xml',language:'JavaScript',label:component}]})));
      - id: plan
        uses: $/actions/quality/record-ci-reports
        with:
          operation: plan
          producers: ${{ steps.components.outputs.producers }}
  fixtures:
    needs: configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create native reports with the same basename
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPONENT: ${{ matrix.component }}
        with:
          script: |-
            const fs = require('node:fs');
            const directory = '.fixture-native/'+process.env.COMPONENT;
            fs.mkdirSync(directory,{recursive:true});
            fs.writeFileSync(directory+'/index.js','export const value = 1;\n');
            fs.writeFileSync(directory+'/cobertura.xml','<coverage line-rate="1"><sources><source>.</source></sources><packages><package name="fixture"><classes><class filename="index.js"><lines><line number="1" hits="1"/></lines></class></classes></package></packages></coverage>');
            fs.writeFileSync(directory+'/junit.xml','<testsuite tests="1"><testcase name="fixture"/></testsuite>');
      - uses: $/actions/quality/record-ci-reports
        with:
          working-directory: .fixture-native/${{ matrix.component }}
          report-plan: ${{ toJSON(fromJSON(needs.configuration.outputs.selections)[matrix.component]) }}
  collect:
    needs:
      - configuration
      - fixtures
    uses: $/.github/workflows/ci-reports.yml
    permissions:
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
    with:
      comment: false
      job-results: ${{ toJSON(needs) }}
  verify:
    needs: collect
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact-id }}
          path: ${{ runner.temp }}/report-collection
          merge-multiple: true
      - id: verify
        uses: $/actions/quality/record-ci-reports
        with:
          operation: verify
          working-directory: ${{ runner.temp }}/report-collection
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILES: ${{ steps.verify.outputs.files }}
        with:
          script: |-
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const files = process.env.FILES.split(',');
            assert.equal(files.length,2);
            for (const component of ['frontend','backend']) assert.ok(files.some(file=>fs.readFileSync(file,'utf8').includes('filename=".fixture-native/'+component+'/index.js"')));
            const collection=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/report-collection/collection.json','utf8'));
            assert.equal(collection.complete,true);
            assert.equal(collection.statuses.length,2);
            assert.equal(collection.reportFiles.filter(file=>file.endsWith('junit.xml')).length,2);
