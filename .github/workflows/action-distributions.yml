# Rebuild committed Node.js action distributions in Dependabot PRs.
# Follow the [setup guide](../../docs/usage/action-distributions.md) for the two
# event wrappers and package allowlist. The generated Usage block lists the call
# inputs; execution requires the pull_request and workflow_run wrappers in the guide.
# The pull_request caller passes no secrets. Only the trusted workflow_run caller
# passes the CI bot App key; its writer never executes code from the PR.
name: Action distributions

on:
  workflow_call:
    inputs:
      github-app-client-id:
        description: GitHub App client ID, required by the workflow_run writer.
        type: string
        required: false
    secrets:
      github-app-key:
        description: GitHub App private key, passed only by the workflow_run caller.
        required: false

permissions: {}

jobs:
  rebuild:
    if:
      >- # zizmor: ignore[bot-conditions] PR author and origin are checked too; actor check prevents bot commit loops.
      github.event_name == 'pull_request' &&
      github.actor_id == '49699333' &&
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout shared implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Rebuild affected distributions
        id: build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { ActionDistributions } = require('./automation/.github/scripts/action-distributions.cjs');
            await new ActionDistributions({ github, context, core }).build({
              workspace: `${process.env.GITHUB_WORKSPACE}/source`,
              output: `${process.env.RUNNER_TEMP}/action-distributions/distributions.json`,
            });
      - name: Upload generated bytes
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-distributions-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-distributions/distributions.json
          if-no-files-found: error
          retention-days: 1

  commit:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.id == 49699333 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: action-distributions-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted shared implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Validate originating run and current PR
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { ActionDistributions } = require('./.github/scripts/action-distributions.cjs');
            await new ActionDistributions({ github, context, core }).prepare();
      - name: Download this attempt's generated bytes
        if: steps.prepare.outputs.artifact-id
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.prepare.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/incoming-distributions
      - name: Create repository-scoped writer token
        if: steps.prepare.outputs.artifact-id
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-key }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: read
      - name: Commit distributions if the PR head is unchanged
        if: steps.prepare.outputs.artifact-id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { ActionDistributions } = require('./.github/scripts/action-distributions.cjs');
            await new ActionDistributions({ github, context, core })
              .commit(`${process.env.RUNNER_TEMP}/incoming-distributions/distributions.json`);
