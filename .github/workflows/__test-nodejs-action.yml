# Common must test its reporting primitives before dependent language workflows
# adopt them. Keep tooling on released actions and record reports locally.
name: Internal - Test a Node.js action package

on:
  workflow_call:
    inputs:
      working-directory:
        description: Action package with an npm lockfile and a test:ci script producing native test reports.
        type: string
        required: true
    outputs:
      report-plan:
        description: Expected native source-test report plan.
        value: ${{ jobs.test.outputs.report-plan }}

permissions: {}

jobs:
  test:
    name: Source tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      report-plan: ${{ steps.plan.outputs.report-plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: plan
        uses: $/actions/quality/record-ci-reports
        with:
          operation: plan
          producers: ${{ format('[{{"key":"test","type":"test","directory":{0}}}]', toJSON(inputs.working-directory)) }}
      - uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Run package-owned source tests
        working-directory: ${{ inputs.working-directory }}
        run: npm run test:ci
      - name: Retain native test reports
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: $/actions/quality/record-ci-reports
        with:
          working-directory: ${{ inputs.working-directory }}
          report-plan: ${{ steps.plan.outputs.report-plan }}

  code-ql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          config-file: .github/codeql/config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
