# Build committed Node.js action distributions for allowed automation PRs.
# Use this workflow from a pull_request caller with no secrets. Configure both
# callers through inputs as shown in the [setup guide](../../docs/usage/action-distributions.md).
# The generated Usage block lists inputs; execution requires the guide's event wrapper.
name: Build action distributions

on:
  workflow_call:
    inputs:
      working-directories:
        description: Newline-separated package directories relative to the repository root. Use . for a root package.
        type: string
        default: .
      output-directory:
        description: Generated directory relative to each package. Only files inside it may be committed.
        type: string
        default: dist
      required-files:
        description: Newline-separated files required in every generated directory. Empty accepts any nonempty output.
        type: string
        default: |
          index.js
          licenses.txt
      pull-request-authors:
        description: JSON array of dependabot or renovate presets, or objects with login, numeric account ID and optional branch-prefix and commit-message-suffix.
        type: string
        default: '["dependabot","renovate"]'
      artifact-name:
        description: Artifact name prefix. The run attempt is appended automatically. Must match in both callers.
        type: string
        default: action-distributions
      node-version:
        description: Node.js version used for npm install and the build script.
        type: string
        default: "24"
      build-script:
        description: npm script name to run after npm ci with dependency lifecycle scripts disabled.
        type: string
        default: build
      retention-days:
        description: Artifact retention in days, within the repository's artifact policy.
        type: number
        default: 1

permissions: {}

jobs:
  rebuild:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      WORKING_DIRECTORIES: ${{ inputs.working-directories }}
      OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      REQUIRED_FILES: ${{ inputs.required-files }}
      PULL_REQUEST_AUTHORS: ${{ inputs.pull-request-authors }}
      ARTIFACT_NAME: ${{ inputs.artifact-name }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
    steps:
      - name: Checkout shared implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Select eligible PR and affected packages
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { ActionDistributions } = require('./automation/.github/scripts/action-distributions.cjs');
            await new ActionDistributions({ github, context, core }).prepareBuild();
      - name: Checkout exact PR head
        if: steps.prepare.outputs.head-sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.head-sha }}
          path: source
          persist-credentials: false
      - if: steps.prepare.outputs.head-sha
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Rebuild affected distributions
        if: steps.prepare.outputs.head-sha
        id: build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { ActionDistributions } = require('./automation/.github/scripts/action-distributions.cjs');
            await new ActionDistributions({ github, context, core }).build({
              workspace: `${process.env.GITHUB_WORKSPACE}/source`,
              output: `${process.env.RUNNER_TEMP}/action-distributions/distributions.json`,
            });
      - name: Upload generated bytes
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-distributions/distributions.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
