name: Internal - Tests for coverage-reports action
on:
  workflow_call:
permissions: {}
jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: actions/quality/coverage-reports
      build: ""
      lint: ""
      test: '{"comment":false,"report-group":"test-action-coverage-reports"}'
  fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Arrange - Independent reports with the same basename
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPONENT: ${{ matrix.component }}
        with:
          script: |
            const fs = require('node:fs');
            const directory = `.fixture-native/${process.env.COMPONENT}`;
            fs.mkdirSync(directory, {recursive: true});
            fs.writeFileSync(`${directory}/index.js`, 'export const value = 1;\n');
            fs.writeFileSync(`${directory}/cobertura.xml`, '<coverage line-rate="1"><sources><source>.</source></sources><packages><package name="fixture"><classes><class filename="index.js"><lines><line number="1" hits="1"/></lines></class></classes></package></packages></coverage>');
            fs.writeFileSync(`${directory}/junit.xml`, '<testsuite tests="1"><testcase name="fixture"/></testsuite>');
      - name: Act - Prepare coverage without write permissions
        uses: $/actions/quality/coverage-reports
        with:
          working-directory: .fixture-native/${{ matrix.component }}
          report-group: fixtures
          reports: '[{"file":"cobertura.xml","language":"JavaScript","label":"${{ matrix.component }}"}]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports-${{ github.run_attempt }}-fixtures-${{ matrix.component }}
          path: .fixture-native/${{ matrix.component }}/junit.xml
          retention-days: 1
  collect:
    needs: fixtures
    uses: $/.github/workflows/ci-reports.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      comment: false
      job-results: ${{ toJSON(needs) }}
      coverage-reports: '[{"job":"fixtures","label":"frontend"},{"job":"fixtures","label":"backend"}]'
  verify:
    needs: collect
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        report: ${{ fromJSON(needs.collect.outputs.coverage-reports) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.collect.outputs.coverage-artifact-id }}
          path: ${{ runner.temp }}/coverage-collection
          merge-multiple: true
      - name: Act - Verify isolated publication input
        id: verify
        uses: $/actions/quality/coverage-reports
        with:
          operation: verify
          working-directory: ${{ runner.temp }}/coverage-collection
          reports: ${{ format('[{0}]', toJSON(matrix.report)) }}
      - name: Assert - Every component survived artifact transfer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERIFIED_FILE: ${{ steps.verify.outputs.file }}
          COMPONENT: ${{ matrix.report.label }}
        with:
          script: |
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const report = fs.readFileSync(process.env.VERIFIED_FILE, 'utf8');
            assert.ok(report.includes(`filename=".fixture-native/${process.env.COMPONENT}/index.js"`));
            assert.equal(JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/coverage-collection/manifest.json`, 'utf8')).reports.length, 2);
