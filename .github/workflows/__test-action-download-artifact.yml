---
name: Internal - Tests for download-artifact action

on:
  # yamllint disable-line rule:truthy
  workflow_call:
permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: actions/download-artifact
      build: ""
      lint: ""
      code-ql: '{"languages":"typescript","config-file":".github/codeql/config.yml"}'
      test: '{"comment":false,"report-group":"test-action-download-artifact"}'

  integration-tests:
    name: Download a new artifact and verify its contents
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Arrange - Write a small artifact
        shell: bash
        run: printf '%s' 'artifact readiness contract' > "$RUNNER_TEMP/artifact.txt"

      - name: Arrange - Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.txt
          if-no-files-found: error
          retention-days: 1

      - name: Act - Download the uploaded artifact
        uses: $/actions/download-artifact
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-artifact

      - name: Assert - Verify downloaded contents
        shell: bash
        run: cmp "$RUNNER_TEMP/artifact.txt" "$RUNNER_TEMP/downloaded-artifact/artifact.txt"
