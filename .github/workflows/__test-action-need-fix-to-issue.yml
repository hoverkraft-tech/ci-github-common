name: Internal - Tests for need-fix-to-issue action

on:
  workflow_call:
    outputs:
      report-plan:
        description: Expected native report plan.
        value: ${{ jobs.continuous-integration.outputs.report-plan }}
permissions:
  contents: read

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@aeab7d712c734308587b10eb22d14c511f8e846a # unified reports (PR #624, unreleased)
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: ./actions/need-fix-to-issue
      build: ""
      lint: ""
      code-ql: '{"languages":"typescript","config-file":".github/codeql/config.yml"}'
      test: '{"coverage":false}'
