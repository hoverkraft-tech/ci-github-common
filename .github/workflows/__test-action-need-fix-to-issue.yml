name: Internal - Tests for need-fix-to-issue action

on:
  workflow_call:
    outputs:
      report-plan:
        description: Expected native report plan.
        value: ${{ jobs.continuous-integration.outputs.report-plan }}
permissions:
  contents: read

jobs:
  continuous-integration:
    uses: $/.github/workflows/__test-nodejs-action.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: ./actions/need-fix-to-issue
