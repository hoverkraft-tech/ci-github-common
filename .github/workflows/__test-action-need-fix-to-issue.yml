name: Internal - Tests for need-fix-to-issue action

on:
  workflow_call:
permissions:
  contents: read

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: ./actions/need-fix-to-issue
      build: ""
      lint: ""
      code-ql: '{"languages":"typescript","config-file":".github/codeql/config.yml"}'
      test: '{"comment":false,"report-group":"test-action-need-fix-to-issue"}'
