# Reusable workflow to convert comments requiring fixes (todo, FIXME) to issues.
# Uses the [Need fix to Issue action](../../actions/need-fix-to-issue/README.md) to create, categorize, and deduplicate issues.
# Generated issues receive the need-fix label and the Bug issue type when available.
# Duplicate issues with the same title and source file are closed.

name: "Need fix to Issue"
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    #checkov:skip=CKV_GHA_7: required
    inputs:
      manual-commit-ref:
        description: "The SHA of the commit to get the diff for."
        required: true
      manual-base-ref:
        description: "By default, the commit entered above is compared to the one directly before it; to go back further, enter an earlier SHA here."
        required: false
  workflow_call:
    inputs:
      runs-on:
        description: |
          JSON array of runner(s) to use.
          See https://docs.github.com/en/actions/using-jobs/choosing-the-runner-for-a-job.
        type: string
        default: '["ubuntu-latest"]'
        required: false
      manual-commit-ref:
        description: "The SHA of the commit to get the diff for."
        type: string
        required: false
      manual-base-ref:
        description: "By default, the commit entered above is compared to the one directly before it; to go back further, enter an earlier SHA here."
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  need-fix-to-issue:
    name: "🔍 Convert TODO/FIXME to Issue"
    runs-on: ${{ inputs.runs-on && fromJson(inputs.runs-on) || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: Create and manage need-fix issues
        uses: $/actions/need-fix-to-issue
        with:
          manual-commit-ref: ${{ inputs.manual-commit-ref }}
          manual-base-ref: ${{ inputs.manual-base-ref }}
