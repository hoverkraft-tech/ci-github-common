name: Internal - Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  test-bundled-actions:
    permissions:
      contents: read
    uses: $/.github/workflows/test-action-distributions.yml

  test-action-distributions:
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    uses: $/.github/workflows/__test-action-distributions.yml

  test-action-test-action-distribution:
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    uses: $/.github/workflows/__test-action-test-action-distribution.yml

  lint:
    name: linter
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    uses: $/.github/workflows/linter.yml
    with:
      comment: false

  test-action-matrix-outputs:
    needs: lint
    permissions:
      contents: read
    uses: $/.github/workflows/__test-action-matrix-outputs.yml

  test-action-lint-pull-request-title:
    needs: lint
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    uses: $/.github/workflows/__test-action-lint-pull-request-title.yml

  test-action-checkout:
    needs: lint
    permissions:
      contents: read
    uses: $/.github/workflows/__test-action-checkout.yml

  test-action-checkout-issue-comment:
    needs: lint
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/__test-action-checkout-issue-comment.yml

  test-action-get-github-actions-bot-user:
    needs: lint
    permissions:
      contents: read
    uses: $/.github/workflows/__test-action-get-github-actions-bot-user.yml

  test-action-get-issue-number:
    needs: lint
    permissions:
      contents: read
    uses: $/.github/workflows/__test-action-get-issue-number.yml

  test-action-parse-ci-reports:
    needs: lint
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    uses: $/.github/workflows/__test-action-parse-ci-reports.yml

  test-action-need-fix-to-issue:
    needs: lint
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    uses: $/.github/workflows/__test-action-need-fix-to-issue.yml

  test-action-repository-owner-is-organization:
    needs: lint
    permissions:
      contents: read
    uses: $/.github/workflows/__test-action-repository-owner-is-organization.yml

  test-action-slugify:
    needs: lint
    permissions:
      contents: read
    uses: $/.github/workflows/__test-action-slugify.yml

  test-action-working-directory:
    needs: lint
    permissions:
      contents: read
    uses: $/.github/workflows/__test-action-working-directory.yml

  test-workflow-ci-reports:
    needs: lint
    uses: $/.github/workflows/__test-workflow-ci-reports.yml
    permissions:
      contents: read
      pull-requests: write

  reports:
    needs:
      - lint
      - test-action-distributions
      - test-action-test-action-distribution
      - test-action-lint-pull-request-title
      - test-action-parse-ci-reports
      - test-action-need-fix-to-issue
    if: always()
    uses: $/.github/workflows/ci-reports.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
