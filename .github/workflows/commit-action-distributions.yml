# Commit generated distributions from the matching successful PR build.
# Use this workflow only from the trusted default-branch workflow_run caller in the
# [setup guide](../../docs/usage/action-distributions.md). Its inputs define the write
# allowlist. The writer never checks out or executes PR code. The generated Usage
# block lists inputs; execution requires the guide's workflow_run event wrapper.
name: Commit action distributions

on:
  workflow_call:
    inputs:
      working-directories:
        description: Newline-separated package directories relative to the repository root. Use . for a root package.
        type: string
        default: .
      output-directory:
        description: Generated directory relative to each package. Only files inside it may be committed.
        type: string
        default: dist
      required-files:
        description: Newline-separated files required in every generated directory. Empty accepts any nonempty output.
        type: string
        default: |
          index.js
          licenses.txt
      pull-request-authors:
        description: JSON array of dependabot or renovate presets, or objects with login, numeric id and optional branch-prefix and commit-message-suffix.
        type: string
        default: '["dependabot","renovate"]'
      artifact-name:
        description: Artifact name prefix. The run attempt is appended automatically. Must match in both callers.
        type: string
        default: action-distributions
      build-workflow:
        description: Repository-relative path of the pull_request caller workflow that produced the artifact.
        type: string
        required: true
      commit-message:
        description: Single-line commit headline. Per-author suffixes and a loop-prevention body trailer are appended.
        type: string
        default: "build: regenerate action distributions"
      github-app-client-id:
        description: Client ID of the GitHub App installed on the caller repository with contents write and actions and pull requests read access.
        type: string
        required: true
    secrets:
      github-app-key:
        description: GitHub App private key. Pass only from the trusted workflow_run caller.
        required: true

permissions: {}

jobs:
  commit:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: action-distributions-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      WORKING_DIRECTORIES: ${{ inputs.working-directories }}
      OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      REQUIRED_FILES: ${{ inputs.required-files }}
      PULL_REQUEST_AUTHORS: ${{ inputs.pull-request-authors }}
      ARTIFACT_NAME: ${{ inputs.artifact-name }}
      BUILD_WORKFLOW: ${{ inputs.build-workflow }}
      COMMIT_MESSAGE: ${{ inputs.commit-message }}
    steps:
      - name: Checkout trusted shared implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Validate originating run and current PR
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { ActionDistributions } = require('./.github/scripts/action-distributions.cjs');
            await new ActionDistributions({ github, context, core }).prepare();
      - name: Download this attempt's generated bytes
        if: steps.prepare.outputs.artifact-id
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.prepare.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/incoming-distributions
      - name: Create repository-scoped writer token
        if: steps.prepare.outputs.artifact-id
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-key }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: read
      - name: Commit distributions if the PR head is unchanged
        if: steps.prepare.outputs.artifact-id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { ActionDistributions } = require('./.github/scripts/action-distributions.cjs');
            await new ActionDistributions({ github, context, core })
              .commit(`${process.env.RUNNER_TEMP}/incoming-distributions/distributions.json`);
