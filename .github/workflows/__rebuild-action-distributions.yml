name: Internal - Rebuild action distributions

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: rebuild-distributions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  distributions:
    uses: $/.github/workflows/build-action-distributions.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      working-directories: |
        actions/quality/parse-ci-reports
      pull-request-authors: |
        ["dependabot", "renovate", {"login":"hoverkraft-bot[bot]","id":128996893,"branch-prefix":"renovate/"}]
