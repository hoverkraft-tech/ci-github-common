name: Internal - Tests for lint-pull-request-title action

on:
  workflow_call:

permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@02a04ad25ceaacdf3b7200e45fb7fec07fadf4fa # 2.1.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: ./actions/quality/lint-pull-request-title
      build: null
      lint: null
      test: '{ "coverage": null }'

  integration-tests:
    name: Validate event title with repository configuration
    if: ${{ github.event.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pull request title
        uses: $/actions/quality/lint-pull-request-title
