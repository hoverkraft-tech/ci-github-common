name: Internal - Tests for lint-pull-request-title action

on:
  workflow_call:
    outputs:
      report-plan:
        description: Expected native report plan.
        value: ${{ jobs.continuous-integration.outputs.report-plan }}
permissions: {}

jobs:
  continuous-integration:
    uses: $/.github/workflows/__test-nodejs-action.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: ./actions/quality/lint-pull-request-title

  integration-tests:
    name: Validate event title with repository configuration
    if: ${{ github.event.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate pull request title
        uses: $/actions/quality/lint-pull-request-title
