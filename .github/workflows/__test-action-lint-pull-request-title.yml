name: Internal - Tests for lint-pull-request-title action

on:
  workflow_call:

permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: ./actions/quality/lint-pull-request-title
      build: ""
      lint: ""
      code-ql: '{"languages":"typescript","config-file":".github/codeql/config.yml"}'
      test: '{"comment":false,"report-group":"test-action-lint-pull-request-title"}'

  integration-tests:
    name: Validate event title with repository configuration
    if: ${{ github.event.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pull request title
        uses: $/actions/quality/lint-pull-request-title
