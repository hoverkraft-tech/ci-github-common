name: Experiment report lifecycle
on:
  push:
    branches: [test/ci-reporting-feasibility-20261127]
permissions:
  contents: read
jobs:
  permissions-ceiling:
    uses: ./.github/workflows/__experiment-report-publisher.yml
    permissions:
      code-quality: write
    with:
      native: false
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      code-quality: read
    steps:
      - name: Inspect documented feature discovery surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          evidence = {}
          for name, endpoint in [('repository', f'repos/{repo}'),
                                 ('findings', f'repos/{repo}/code-quality/findings?per_page=1')]:
              result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              evidence[name] = {'exit_code': result.returncode, 'body': result.stdout, 'error': result.stderr}
          pathlib.Path('capability.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experiment-capability-${{ github.run_attempt }}
          path: capability.json
          retention-days: 1
          if-no-files-found: error
  alpha:
    uses: ./.github/workflows/__experiment-report-producer.yml
    permissions:
      actions: read
      contents: read
    with:
      project: alpha
  beta:
    uses: ./.github/workflows/__experiment-report-producer.yml
    permissions:
      actions: read
      contents: read
    with:
      project: beta
  intentionally-skipped:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  collect:
    needs: [alpha, beta, intentionally-skipped]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Capture scheduler state and report inventory
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          evidence = {'needs': json.loads(os.environ['NEEDS_JSON']),
                      'attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          for label, path in [('latest_jobs', 'jobs?filter=latest&per_page=100'),
                              ('all_jobs', 'jobs?filter=all&per_page=100'),
                              ('artifacts', 'artifacts?per_page=100')]:
              evidence[label] = json.loads(subprocess.check_output(['gh', 'api', f'{root}/{path}']))
          pathlib.Path('collection.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence['needs'], indent=2))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experiment-collection-${{ github.run_attempt }}
          path: collection.json
          retention-days: 1
          if-no-files-found: error
