name: Internal - Tests for CI reports workflow
on:
  workflow_call: null
permissions: {}
jobs:
  any-lint-job-name:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      report-plan: ${{ steps.reports.outputs.report-plan }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: require('node:fs').writeFileSync('super-linter-summary.md','| Linter | Status |\n| --- | --- |\n| Fixture linter | Passed |\n');
      - id: reports
        uses: $/actions/quality/record-ci-reports
        with:
          type: lint
          summary-file: super-linter-summary.md
      - name: Upload an unrelated artifact to exercise exact discovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports-${{ github.run_attempt }}-unrelated
          path: super-linter-summary.md
          retention-days: 1
  reports:
    needs: any-lint-job-name
    uses: $/.github/workflows/ci-reports.yml
    permissions:
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
    with:
      comment: false
      job-results: ${{ toJSON(needs) }}
  assert:
    needs: reports
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKDOWN: ${{ needs.reports.outputs.markdown }}
        with:
          script: |-
            const assert = require('node:assert/strict');
            const body=process.env.MARKDOWN;
            assert.match(body,/Fixture linter/);
            assert.match(body,/any-lint-job-name/);
            assert.match(body,/1 success/);
            assert.doesNotMatch(body,/unrelated|Reporting incomplete/);
            assert.equal((body.match(/<details>/g)||[]).length,(body.match(/<\/details>/g)||[]).length);
