name: Internal - Tests for CI reports workflow
on:
  workflow_call:
    inputs:
      artifact-id:
        description: Collection produced by the single outer reporting workflow.
        type: string
        required: true
      markdown:
        description: Final completion summary.
        type: string
        required: true
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: $/actions/download-artifact
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: ${{ runner.temp }}/ci-report-verification
          merge-multiple: "true"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKDOWN: ${{ inputs.markdown }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const directory = process.env.RUNNER_TEMP + '/ci-report-verification';
            try {
              const collection = JSON.parse(fs.readFileSync(directory + '/collection.json', 'utf8'));
              assert.equal(collection.version, 2);
              assert.equal(collection.checks.filter(check => check.check.name === 'Lifecycle fixture').length, 2);
              assert.ok(collection.checks.some(check => check.check.name === 'First custom check'));
              assert.ok(collection.checks.some(check => check.check.name === 'Second custom check'));
              assert.ok(collection.datasets.length > 0);
              const body = process.env.MARKDOWN;
              assert.match(body, /CI checks passed/);
              assert.match(body, /Publication:/);
              assert.match(body, /Report provenance/);
              assert.equal((body.match(/<details>/g) || []).length, (body.match(/<\/details>/g) || []).length);
            } finally {
              fs.rmSync(directory, { recursive: true, force: true });
            }
