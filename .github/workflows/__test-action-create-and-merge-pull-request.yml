name: Internal - Tests for create-and-merge-pull-request action

on:
  workflow_call:
    outputs:
      report-plan:
        description: Expected native report plan.
        value: ${{ jobs.continuous-integration.outputs.report-plan }}
permissions: {}

jobs:
  continuous-integration:
    uses: $/.github/workflows/__test-nodejs-action.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: ./actions/create-and-merge-pull-request
