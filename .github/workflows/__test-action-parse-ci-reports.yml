name: Internal - Tests for parse-ci-reports action

on:
  workflow_call:

permissions:
  contents: read

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@02a04ad25ceaacdf3b7200e45fb7fec07fadf4fa # 2.1.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: ./actions/quality/parse-ci-reports
      build: check:dist
      lint: null
      code-ql: '{"languages":"typescript","config-file":".github/codeql/config.yml"}'
      test: '{ "coverage": null }'

  integration-tests:
    name: Tests for parse-ci-reports action
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: [null, "node:24-bookworm-slim"]
    container: ${{ matrix.container }}
    steps:
      - name: Arrange - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Create test report files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { mkdirSync, writeFileSync } = require('node:fs');

            mkdirSync('test-reports', { recursive: true });

            writeFileSync(
              'test-reports/junit.xml',
              [
                '<?xml version="1.0" encoding="UTF-8"?>',
                '<testsuite name="Test Suite" tests="3" failures="0" errors="0" skipped="0" time="1.234">',
                '  <testcase name="test_example_1" classname="TestClass" time="0.123"/>',
                '  <testcase name="test_example_2" classname="TestClass" time="0.456"/>',
                '  <testcase name="test_example_3" classname="TestClass" time="0.655"/>',
                '</testsuite>',
                '',
              ].join('\n')
            );

            writeFileSync(
              'test-reports/lcov.info',
              [
                'TN:',
                'SF:src/example.js',
                'FN:1,exampleFunction',
                'FNDA:5,exampleFunction',
                'FNF:1',
                'FNH:1',
                'DA:1,5',
                'DA:2,5',
                'DA:3,5',
                'LF:3',
                'LH:3',
                'end_of_record',
                '',
              ].join('\n')
            );

            writeFileSync(
              'test-reports/eslint.json',
              [
                '[',
                '  {',
                '    "filePath": "src/example.js",',
                '    "messages": [],',
                '    "errorCount": 0,',
                '    "warningCount": 0',
                '  }',
                ']',
                '',
              ].join('\n')
            );

            core.info('Created test report files under test-reports');
            writeFileSync('test-reports/failing-junit.xml', '<testsuite tests="1" failures="1"><testcase name="failure"><failure message="expected"/></testcase></testsuite>');

      - name: Act - Run parse-ci-reports action
        id: parse-ci-reports
        uses: $/actions/quality/parse-ci-reports
        with:
          report-paths: |
            test-reports/junit.xml
            test-reports/lcov.info
            test-reports/eslint.json
          report-name: "Test Reports"
          output-format: "summary,markdown"

      - name: Assert - Check parse-ci-reports outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEPS_PARSE_CI_REPORTS_OUTPUTS_MARKDOWN: ${{ steps.parse-ci-reports.outputs.markdown }}
          STEPS_PARSE_CI_REPORTS_OUTPUTS_SUMMARY: ${{ steps.parse-ci-reports.outputs.summary }}
          STEPS_PARSE_CI_REPORTS_OUTPUTS_PARSED_FILES: ${{ steps.parse-ci-reports.outputs.parsed-files }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const markdown = process.env.STEPS_PARSE_CI_REPORTS_OUTPUTS_MARKDOWN;
            const summary = process.env.STEPS_PARSE_CI_REPORTS_OUTPUTS_SUMMARY;
            const parsedFiles = process.env.STEPS_PARSE_CI_REPORTS_OUTPUTS_PARSED_FILES;

            try {
              assert.ok(markdown && markdown.length > 0, 'parse-ci-reports markdown output is empty');
              assert.ok(summary && summary.length > 0, 'parse-ci-reports summary output is empty');
              assert.ok(parsedFiles && parsedFiles.length > 0, 'parse-ci-reports parsed-files output is empty');
              JSON.parse(parsedFiles);
            } catch (error) {
              core.setFailed(error.message);
              return;
            }

            core.info('All outputs are valid');

      - name: Act - Missing explicit reports fail
        id: missing-report
        continue-on-error: true
        uses: $/actions/quality/parse-ci-reports
        with:
          report-paths: test-reports/junit.xml,test-reports/missing.xml

      - name: Arrange - A failed test command
        id: failed-test
        continue-on-error: true
        shell: sh
        run: exit 1

      - name: Act - Reporting preserves the test failure
        id: failed-test-report
        if: always()
        uses: $/actions/quality/parse-ci-reports
        with:
          report-paths: test-reports/failing-junit.xml

      - name: Act - Fail on report errors when requested
        id: fail-on-error
        continue-on-error: true
        uses: $/actions/quality/parse-ci-reports
        with:
          report-paths: test-reports/failing-junit.xml
          fail-on-error: "true"

      - name: Act - Empty auto-detection is optional
        uses: $/actions/quality/parse-ci-reports
        with:
          working-directory: actions/quality/parse-ci-reports/src
          report-paths: auto:all

      - name: Assert - No installed parser dependencies and missing report rejected
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MISSING_REPORT_OUTCOME: ${{ steps.missing-report.outcome }}
          TEST_OUTCOME: ${{ steps.failed-test.outcome }}
          REPORT_OUTCOME: ${{ steps.failed-test-report.outcome }}
          REPORT_HAS_ERRORS: ${{ steps.failed-test-report.outputs.has-errors }}
          FAIL_ON_ERROR_OUTCOME: ${{ steps.fail-on-error.outcome }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            assert.equal(process.env.MISSING_REPORT_OUTCOME, 'failure');
            assert.equal(process.env.TEST_OUTCOME, 'failure');
            assert.equal(process.env.REPORT_OUTCOME, 'success');
            assert.equal(process.env.REPORT_HAS_ERRORS, 'true');
            assert.equal(process.env.FAIL_ON_ERROR_OUTCOME, 'failure');
            assert.equal(fs.existsSync('actions/quality/parse-ci-reports/node_modules'), false);
