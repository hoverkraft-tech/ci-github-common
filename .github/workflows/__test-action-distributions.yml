name: Internal - Tests for action-distributions action

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: actions/action-distributions
      build: ""
      lint: ""
      code-ql: '{"languages":"typescript","config-file":".github/codeql/config.yml"}'
      test: '{"comment":false,"report-group":"test-action-distributions"}'

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise public action on an unrelated package
        id: prepare-build
        uses: $/actions/action-distributions
        with:
          operation: prepare-build
          working-directories: fixtures/unrelated-action
      - name: Exercise public writer action outside workflow_run
        if: github.event_name != 'workflow_run'
        id: prepare-commit
        uses: $/actions/action-distributions
        with:
          operation: prepare-commit
      - name: Check public no-op outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.prepare-build.outputs.head-sha }}
          ARTIFACT_ID: ${{ steps.prepare-commit.outputs.artifact-id }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.equal(process.env.HEAD_SHA, '');
            assert.equal(process.env.ARTIFACT_ID, '');
