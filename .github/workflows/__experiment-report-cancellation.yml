name: Experiment report cancellation
on:
  push:
    branches: [test/ci-reporting-feasibility-20261127]
permissions: {}
jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait for the controlled cancellation
        run: python3 -c 'import signal; signal.pause()'
  cancel-this-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel only this experiment after its producer starts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess, time
          root = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          for _ in range(30):
              jobs = json.loads(subprocess.check_output(['gh', 'api', f'{root}/jobs?per_page=100']))['jobs']
              if any(job['name'] == 'producer' and job['status'] == 'in_progress' for job in jobs):
                  subprocess.run(['gh', 'api', '--method', 'POST', f'{root}/cancel'], check=True)
                  break
              time.sleep(2)
          else:
              raise RuntimeError('Producer did not start within the experiment deadline')
  report-unless-cancelled:
    needs: producer
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Reporting was allowed to start.'
  completion-always:
    needs: producer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
        run: test "$PRODUCER_RESULT" = success
